<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HubSpot Social Media Certification — Dylan Hult</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font-family:Arial,Helvetica,sans-serif}.back{position:fixed;z-index:2;top:18px;left:18px;padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 4px 18px rgba(0,0,0,.08);color:#33475b;text-decoration:none;font-size:13px}.wrap{min-height:100vh;display:grid;place-items:center;padding:58px 18px 24px}.cert{display:block;width:min(1140px,96vw);height:auto;box-shadow:0 18px 50px rgba(51,71,91,.10);background:#fff}.status{color:#33475b;font-size:14px}
</style>
</head>
<body>
<a class="back" href="index.html#certifications">← Back to portfolio</a>
<div class="wrap"><div id="status" class="status">Loading certificate…</div><img id="cert" class="cert" alt="HubSpot Social Media Certified certificate for Dylan Hult" hidden></div>
<script>
(async()=>{
 const parts=["assets/hubspot-social-1.b64","assets/hubspot-social-2.b64","assets/hubspot-social-3.b64","assets/hubspot-social-4.b64"];
 try{
  const chunks=await Promise.all(parts.map(async p=>{const r=await fetch(p);if(!r.ok)throw new Error(p);return r.text()}));
  const img=document.getElementById("cert");
  img.src="data:image/png;base64,"+chunks.join("").replace(/\s+/g,"");
  img.onload=()=>{document.getElementById("status").hidden=true;img.hidden=false};
  img.onerror=()=>{document.getElementById("status").textContent="Certificate could not be displayed."};
 }catch(e){document.getElementById("status").textContent="Certificate could not be displayed."}
})();
</script>
</body>
</html>
